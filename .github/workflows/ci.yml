name: CI

on:
  push:
    branches: [trunk]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Сборка и тесты
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ libcurl4-openssl-dev nlohmann-json3-dev libncurses-dev

      - name: Конфигурирование
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGHATV_TESTS=ON

      - name: Сборка
        run: cmake --build build -j"$(nproc)"

      - name: Тесты
        run: ctest --test-dir build --output-on-failure

  docker:
    name: Docker-образ (проверка сборки)
    # Для pull request и ручного запуска образ только собирается
    if: github.event_name != 'push'
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Сборка
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha

  publish:
    name: Публикация образа
    # Из trunk и тегов образ публикуется в ghcr.io и на Docker Hub как развёртывание в окружение ghcr.
    # Без секретов DOCKERHUB_USERNAME и DOCKERHUB_TOKEN публикация на Docker Hub пропускается.
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      deployments: write
    environment:
      name: ghcr
      url: https://github.com/${{ github.repository }}/pkgs/container/ghatv
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Вход в ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Вход в Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Теги образа
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            name=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ghatv,enable=${{ env.DOCKERHUB_USERNAME != '' }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Сборка и публикация
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GHATV_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Описание на Docker Hub из английского README; относительные ссылки заменяются ссылками на GitHub.
      # Нужен токен с правами Read, Write, Delete: с меньшими правами шаг завершится ошибкой, но сборку не остановит.
      - name: Описание на Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && github.ref == 'refs/heads/trunk'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/ghatv
          short-description: GitHub Actions, pull requests, issues and deployments dashboard on Turbo Vision in the browser
          readme-filepath: ./README.md
          enable-url-completion: true
